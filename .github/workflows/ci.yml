name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Always runs. Needs no secrets, so it works on a fork and on a clean clone.
  # ---------------------------------------------------------------------------
  quality:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `next lint` was REMOVED in Next.js 16, and `next build` no longer lints.
      # Without this step the project would simply never be linted.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run --project unit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

  # ---------------------------------------------------------------------------
  # Talks to a real database, so it only runs where the secrets exist. Skipped
  # rather than faked: an integration test against a mock would prove nothing
  # about whether the service layer and Row Level Security agree.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration and browser tests
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for database credentials
        id: creds
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets not configured — skipping integration and browser tests."
          fi

      - name: Install Playwright browser
        if: steps.creds.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build
        if: steps.creds.outputs.available == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Start the app
        if: steps.creds.outputs.available == 'true'
        run: |
          npm run start -- --port 3001 &
          npx wait-on http://localhost:3001/api/health --timeout 60000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Integration tests
        if: steps.creds.outputs.available == 'true'
        run: npx vitest run --project integration
        env:
          TEST_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}

      - name: Browser tests
        if: steps.creds.outputs.available == 'true'
        run: npx playwright test
        env:
          CI: "true"
          TEST_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.creds.outputs.available == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
